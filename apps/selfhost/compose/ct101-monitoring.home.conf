# ── monitoring.home → Maple (CT 130 "maple", 192.168.100.30:8080, single-origin Caddy) ──
# BRIEF-v4. Same *.home cert as the other sites. Electric shape long-polls (/_sync/) must not be buffered.
# Managed by Talos; source: ~/deploy/maple/selfhost/ct101/monitoring.home
server {
    listen 80;
    server_name monitoring.home;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name monitoring.home;
    include /etc/nginx/snippets/ssl.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://192.168.100.30:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
